# Настройки виджета «Прокси Xray»: ~/.config/xray-widget/config.toml
# Файл может содержать ссылки подписок с токенами — держите его закрытым: chmod 600.
#
# Профили собираются из групп. Группы показываются в списке в том же порядке, что и здесь;
# внутри группы профили сортируются по названию. Одинаковые серверы из разных групп
# объединяются в один профиль.
#
# У каждой группы есть имя и ровно один источник:
#   folder       — папка с профилями: каждый файл *.json — исходящее соединение (outbound) Xray,
#                  имя файла — название профиля. Поддерживаются VLESS (REALITY, WebSocket/TLS,
#                  XHTTP/TLS) и WireGuard. Перенести профили из Throne или Nekoray: import-throne;
#   subscription — ссылка https:// на подписку (список vless://, в том числе в base64);
#                  обновляется раз в 12 часов, сразу — командой `xray-widget refresh`;
#   links        — список ссылок vless:// прямо в этом файле.

[[group]]
name = "Мои"
folder = "~/.config/xray-widget/profiles"

[[group]]
name = "Мой VPN"
subscription = "https://example.com/sub/ВАШ-ТОКЕН"

[[group]]
name = "Друзья"
links = [
  "vless://00000000-0000-4000-8000-000000000001@vpn.example.com:443?security=reality&encryption=none&type=tcp&flow=xtls-rprx-vision&sni=www.example.org&fp=chrome&pbk=PUBLIC-KEY&sid=ab12#Сервер друга",
]

# Понятные подписи для профилей подписок и ссылок: "исходное имя" = "как показывать в виджете".
# Исходное имя видно в развёрнутой строке профиля. Профили из папки проще переименовать файлом.
[labels]
"Сервер друга" = "🇳🇱 Амстердам — сервер друга"
