# Системная служба Xray для виджета «Прокси Xray»: /etc/xray-widget/system.toml
# Файл читает помощник с правами root, поэтому он должен принадлежать root и быть закрыт
# на запись для остальных (права 0644). Ключей и паролей здесь нет.

# Служба systemd с Xray, которую виджет перезапускает после смены профиля.
service = "xray.service"

# Конфиг Xray этой службы. Виджет меняет в нём только входы и исходящие соединения туннелей
# и одно правило маршрутизации; раскладка описана в README, образец — xray-config.example.json.
config = "/usr/local/etc/xray/config.json"

# Исполняемый файл Xray: им конфиг проверяется перед перезапуском.
xray = "/usr/local/bin/xray"

# Метка sockopt.mark для соединений туннелей — нужна, если трафик Xray должен обходить
# системный VPN по правилу `ip rule`. Без этой строки метка не требуется.
# route_mark = 0x58474101

# Порты туннелей на 127.0.0.1. Дополнительный туннель появится в конфиге при первом выборе профиля для него.
[ports]
primary = { socks = 10808, http = 10809 }
secondary = { socks = 10818, http = 10819 }
